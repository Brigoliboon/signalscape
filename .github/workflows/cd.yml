name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish:
    name: publish
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: [publish]
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write production env
        working-directory: api
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          umask 077
          cat > .env <<EOF
          POSTGRES_USER=signalscape
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=signalscape
          JWT_SECRET=${JWT_SECRET}
          SITE_ADDRESS=${SITE_ADDRESS}
          API_IMAGE=ghcr.io/${repo}/api:${IMAGE_TAG}
          EOF
      - name: Pull image and restart stack
        working-directory: api
        run: |
          docker compose --profile prod pull
          docker compose --profile prod up -d
      - name: Smoke test
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL secret is not set"
            exit 1
          fi
          # The VM's curl (Ubuntu 20.04) has no --retry-all-errors, so retry in a loop.
          for i in $(seq 1 12); do
            if curl -fsS "$API_BASE_URL/api/health"; then
              break
            fi
            if [ "$i" = 12 ]; then
              echo "Health check failed"
              exit 1
            fi
            sleep 5
          done
          curl -fsS "$API_BASE_URL/api/docs" >/dev/null
          echo "Smoke test passed"
