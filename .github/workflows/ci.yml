name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  api-lint:
    name: api-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .

  api-test:
    name: api-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalscape
          POSTGRES_PASSWORD: signalscape
          POSTGRES_DB: signalscape_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalscape -d signalscape_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://signalscape:signalscape@localhost:5432/signalscape_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage.xml
          if-no-files-found: ignore

  api-openapi:
    name: api-openapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalscape
          POSTGRES_PASSWORD: signalscape
          POSTGRES_DB: signalscape_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalscape -d signalscape_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://signalscape:signalscape@localhost:5432/signalscape_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Serve API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/docs >/dev/null
          curl -fsS http://127.0.0.1:8000/api/openapi.json | python -c "import json,sys; spec=json.load(sys.stdin); assert '/api/health' in spec['paths']"

  api-docker:
    name: api-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t signalscape-api:ci ./api
      - name: Validate Compose file
        run: docker compose -f api/docker-compose.yml config

  api-audit:
    name: api-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r api/requirements.txt
      - name: Secret scan
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" ghcr.io/gitleaks/gitleaks:latest detect --source /src --config /src/.gitleaks.toml --verbose --redact

  app:
    name: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check for Flutter project
        id: app
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No app/ project yet; skipping Flutter checks (CI-7 to CI-9)."
          fi
      - uses: subosito/flutter-action@v2
        if: steps.app.outputs.present == 'true'
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true
      - name: Fetch packages
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: flutter pub get
      - name: Analyze
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: flutter analyze
      - name: Format
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .
      - name: Test
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: flutter test
      - name: Build release APK
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: flutter build apk --release
      - name: Upload APK
        if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Attach APK to GitHub Release
        if: steps.app.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk

  ci-success:
    name: CI
    needs: [api-lint, api-test, api-openapi, api-docker, api-audit, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: |
          test "${{ needs.api-lint.result }}" = "success"
          test "${{ needs.api-test.result }}" = "success"
          test "${{ needs.api-openapi.result }}" = "success"
          test "${{ needs.api-docker.result }}" = "success"
          test "${{ needs.api-audit.result }}" = "success"
          test "${{ needs.app.result }}" = "success"
